<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - UPCODEZ OTT</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
}

body {
  background: #f5f5f7;
  color: #1a1a1a;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* LOGIN */
.login-box {
  max-width: 380px;
  margin: 100px auto;
  background: #ffffff;
  padding: 40px 32px;
  border-radius: 14px;
  box-shadow: 0 8px 40px rgba(0, 0, 0, 0.08);
  border: 1px solid #e5e5e7;
}

.login-box h2 {
  text-align: center;
  margin-bottom: 28px;
  color: #1a1a1a;
  font-size: 20px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.login-box input {
  width: 100%;
  padding: 12px 16px;
  margin-bottom: 14px;
  background: #f5f5f7;
  border: 1px solid #e5e5e7;
  border-radius: 8px;
  color: #1a1a1a;
  font-size: 14px;
  transition: border-color 0.2s, background 0.2s;
}

.login-box input:focus {
  outline: none;
  border-color: #9ca3af;
  background: #ffffff;
}

.login-box button {
  width: 100%;
  padding: 12px;
  background: #1a1a1a;
  color: #ffffff;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  cursor: pointer;
  font-weight: 600;
  margin-top: 6px;
  transition: background 0.2s;
}

.login-box button:hover {
  background: #374151;
}

/* ADMIN PANEL */
.admin-body {
  padding: 32px;
  max-width: 1100px;
  margin: 0 auto;
}

.admin-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 28px;
  flex-wrap: wrap;
  gap: 12px;
}

.admin-header h1 {
  color: #1a1a1a;
  font-size: 22px;
  font-weight: 700;
}

.logout-btn {
  background: #ffffff;
  color: #1a1a1a;
  border: 1px solid #e5e5e7;
  padding: 9px 18px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.2s;
}

.logout-btn:hover {
  background: #1a1a1a;
  color: #ffffff;
  border-color: #1a1a1a;
}

.form-box {
  background: #ffffff;
  padding: 28px;
  border-radius: 12px;
  margin-bottom: 28px;
  border: 1px solid #e5e5e7;
}

.form-box h3 {
  margin-bottom: 22px;
  color: #1a1a1a;
  font-size: 17px;
  font-weight: 600;
}

.form-box label {
  display: block;
  margin-bottom: 6px;
  font-size: 13px;
  color: #4b5563;
  font-weight: 500;
}

.form-box input[type="text"],
.form-box input[type="file"],
.form-box textarea {
  width: 100%;
  padding: 11px 14px;
  margin-bottom: 16px;
  background: #f5f5f7;
  border: 1px solid #e5e5e7;
  border-radius: 8px;
  color: #1a1a1a;
  font-size: 14px;
  transition: border-color 0.2s, background 0.2s;
  font-family: inherit;
}

.form-box input:focus,
.form-box textarea:focus {
  outline: none;
  border-color: #9ca3af;
  background: #ffffff;
}

.form-box textarea {
  resize: vertical;
  min-height: 100px;
}

.btn-primary {
  background: #1a1a1a;
  color: #ffffff;
  border: none;
  padding: 11px 24px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: background 0.2s;
}

.btn-primary:hover {
  background: #374151;
}

.btn-secondary {
  background: #ffffff;
  color: #1a1a1a;
  border: 1px solid #e5e5e7;
  padding: 11px 24px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  margin-left: 8px;
  transition: all 0.2s;
}

.btn-secondary:hover {
  background: #f5f5f7;
}

.admin-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 18px;
}

.admin-card {
  background: #ffffff;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #e5e5e7;
  transition: box-shadow 0.2s;
}

.admin-card:hover {
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
}

.admin-card img {
  width: 100%;
  height: 140px;
  object-fit: cover;
  background: #f0f0f2;
}

.admin-card .info {
  padding: 14px 16px 10px;
}

.admin-card .info h4 {
  font-size: 14px;
  font-weight: 600;
  color: #1a1a1a;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  line-height: 1.4;
}

.admin-card .actions {
  display: flex;
  gap: 8px;
  padding: 0 16px 16px;
}

.admin-card .actions button {
  flex: 1;
  padding: 9px;
  border: none;
  border-radius: 7px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: opacity 0.2s;
}

.btn-edit {
  background: #f5f5f7;
  color: #1a1a1a;
  border: 1px solid #e5e5e7 !important;
}

.btn-edit:hover {
  background: #e5e5e7;
}

.btn-delete {
  background: #1a1a1a;
  color: #ffffff;
}

.btn-delete:hover {
  background: #374151;
}

#adminPanel {
  display: none;
}

#thumbPreview {
  max-width: 200px;
  border-radius: 8px;
  margin-top: 10px;
  display: none;
  border: 1px solid #e5e5e7;
}

.icon-lg {
  width: 22px;
  height: 22px;
  stroke-width: 2;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
}

@media (max-width: 600px) {
  .admin-body { padding: 20px 16px; }
  .form-box { padding: 22px 18px; }
  .login-box { margin: 60px 16px; padding: 30px 22px; }
}
</style>
</head>
<body>

<div id="loginBox" class="login-box">
  <h2>
    <svg class="icon-lg" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
    Admin Login
  </h2>
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<div id="adminPanel" class="admin-body">
  <div class="admin-header">
    <h1>Admin Panel</h1>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <div class="form-box">
    <h3 id="formTitle">Add New Video</h3>
    <input type="hidden" id="editId">
    <label>Title</label>
    <input type="text" id="title" placeholder="Video title">
    <label>Video URL (Direct MP4 / YouTube)</label>
    <input type="text" id="videoUrl" placeholder="https://...">
    <label>Description</label>
    <textarea id="description" placeholder="Video description..."></textarea>
    <label>Thumbnail (Image Upload)</label>
    <input type="file" id="thumbFile" accept="image/*" onchange="uploadThumb()">
    <label>Or Thumbnail URL</label>
    <input type="text" id="thumbnail" placeholder="Thumbnail URL">
    <img id="thumbPreview" src="" alt="preview">
    <br><br>
    <button class="btn-primary" onclick="saveVideo()" id="saveBtn">Save Video</button>
    <button class="btn-secondary" onclick="resetForm()">Cancel</button>
  </div>

  <h3 style="margin-bottom:16px;color:#1a1a1a;font-size:17px;font-weight:600;">All Videos</h3>
  <div id="adminList" class="admin-list"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, push, set, remove, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDMI4Hx65V5yQjxlafsaLE6Z9ovH-UsUQ8",
  authDomain: "upcodez-ott.firebaseapp.com",
  databaseURL: "https://upcodez-ott-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "upcodez-ott",
  storageBucket: "upcodez-ott.firebasestorage.app",
  messagingSenderId: "162177320042",
  appId: "1:162177320042:web:b9bd09b99d5e9ff2b17613",
  measurementId: "G-TQYMW0LCH7"
};

const IMGBB_API_KEY = "59ff7a77d4e90b6f234f1c8bb49c9ece";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let allVideos = [];

window.login = function() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();

  if (u === 'admin786' && p === 'zishuadmin') {
    sessionStorage.setItem('adminLoggedIn', 'true');
    showAdmin();
  } else {
    alert('Invalid username or password');
  }
};

window.logout = function() {
  sessionStorage.removeItem('adminLoggedIn');
  location.reload();
};

function showAdmin() {
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('adminPanel').style.display = 'block';
  loadVideos();
}

if (sessionStorage.getItem('adminLoggedIn') === 'true') {
  showAdmin();
}

function loadVideos() {
  onValue(ref(db, 'videos'), (snapshot) => {
    allVideos = [];
    snapshot.forEach((child) => {
      allVideos.push({ id: child.key, ...child.val() });
    });
    allVideos.reverse();
    renderAdminList();
  });
}

window.uploadThumb = async function() {
  const fileInput = document.getElementById('thumbFile');
  const file = fileInput.files[0];
  if (!file) return;

  const thumbInput = document.getElementById('thumbnail');
  thumbInput.value = 'Uploading...';

  const formData = new FormData();
  formData.append('image', file);

  try {
    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
      method: 'POST',
      body: formData
    });
    const data = await res.json();

    if (data.success) {
      const url = data.data.url;
      thumbInput.value = url;
      const preview = document.getElementById('thumbPreview');
      preview.src = url;
      preview.style.display = 'block';
    } else {
      alert('Image upload failed');
      thumbInput.value = '';
    }
  } catch (err) {
    console.error(err);
    alert('Image upload error');
    thumbInput.value = '';
  }
};

window.saveVideo = async function() {
  const editId = document.getElementById('editId').value;
  const title = document.getElementById('title').value.trim();
  const videoUrl = document.getElementById('videoUrl').value.trim();
  const description = document.getElementById('description').value.trim();
  const thumbnail = document.getElementById('thumbnail').value.trim();

  if (!title || !videoUrl || !thumbnail) {
    alert('Title, Video URL and Thumbnail are required');
    return;
  }

  const videoData = { title, videoUrl, description, thumbnail, createdAt: Date.now() };

  try {
    if (editId) {
      await update(ref(db, 'videos/' + editId), videoData);
      alert('Video updated');
    } else {
      await set(push(ref(db, 'videos')), videoData);
      alert('Video added');
    }
    resetForm();
  } catch (err) {
    console.error(err);
    alert('Error: ' + err.message);
  }
};

window.resetForm = function() {
  document.getElementById('editId').value = '';
  document.getElementById('title').value = '';
  document.getElementById('videoUrl').value = '';
  document.getElementById('description').value = '';
  document.getElementById('thumbnail').value = '';
  document.getElementById('thumbFile').value = '';
  const preview = document.getElementById('thumbPreview');
  preview.style.display = 'none';
  preview.src = '';
  document.getElementById('formTitle').textContent = 'Add New Video';
};

function renderAdminList() {
  const list = document.getElementById('adminList');
  if (allVideos.length === 0) {
    list.innerHTML = '<p style="color:#9ca3af">No videos yet. Add one above.</p>';
    return;
  }
  list.innerHTML = allVideos.map(v => `
    <div class="admin-card">
      <img src="${v.thumbnail}" alt="" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22200%22><rect width=%22300%22 height=%22200%22 fill=%22%23f0f0f2%22/></svg>'">
      <div class="info">
        <h4>${escapeHtml(v.title)}</h4>
      </div>
      <div class="actions">
        <button class="btn-edit" onclick="editVideo('${v.id}')">Edit</button>
        <button class="btn-delete" onclick="deleteVideo('${v.id}')">Delete</button>
      </div>
    </div>
  `).join('');
}

window.editVideo = function(id) {
  const v = allVideos.find(x => x.id === id);
  if (!v) return;
  document.getElementById('editId').value = v.id;
  document.getElementById('title').value = v.title;
  document.getElementById('videoUrl').value = v.videoUrl;
  document.getElementById('description').value = v.description || '';
  document.getElementById('thumbnail').value = v.thumbnail;
  const preview = document.getElementById('thumbPreview');
  preview.src = v.thumbnail;
  preview.style.display = 'block';
  document.getElementById('formTitle').textContent = 'Edit Video';
  window.scrollTo(0, 0);
};

window.deleteVideo = async function(id) {
  if (!confirm('Are you sure you want to delete this video?')) return;
  try {
    await remove(ref(db, 'videos/' + id));
    alert('Video deleted');
  } catch (err) {
    alert('Error: ' + err.message);
  }
};

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>"']/g, (m) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[m]);
}
</script>
</body>
</html>
