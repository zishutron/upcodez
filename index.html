<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPCODEZ OTT</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
}

body {
  background: #f5f5f7;
  color: #1a1a1a;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 32px;
  background: #ffffff;
  border-bottom: 1px solid #e5e5e7;
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  font-size: 20px;
  font-weight: 700;
  color: #1a1a1a;
  letter-spacing: -0.3px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.logo span {
  color: #6b7280;
  font-weight: 500;
}

/* NAV TABS */
.nav-tabs {
  display: flex;
  gap: 8px;
  padding: 16px 32px;
  background: #ffffff;
  border-bottom: 1px solid #e5e5e7;
}

.tab {
  background: transparent;
  color: #6b7280;
  border: 1px solid #e5e5e7;
  padding: 8px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}

.tab:hover {
  background: #f5f5f7;
  color: #1a1a1a;
}

.tab.active {
  background: #1a1a1a;
  color: #ffffff;
  border-color: #1a1a1a;
}

/* SECTION */
.section {
  display: none;
  padding: 28px 32px;
}

.section.active {
  display: block;
}

.section-title {
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 20px;
  color: #1a1a1a;
  letter-spacing: -0.3px;
}

/* SEARCH BOX (inside search section) */
.search-box {
  display: flex;
  background: #ffffff;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #e5e5e7;
  transition: border-color 0.2s;
  margin-bottom: 24px;
  max-width: 600px;
}

.search-box:focus-within {
  border-color: #9ca3af;
}

.search-box input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: #1a1a1a;
  padding: 12px 18px;
  font-size: 15px;
}

.search-box input::placeholder {
  color: #9ca3af;
}

.search-box button {
  background: #1a1a1a;
  border: none;
  color: #ffffff;
  padding: 0 22px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
}

.search-box button:hover {
  background: #374151;
}

/* VIDEO GRID */
.video-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 20px;
}

.video-card {
  background: #ffffff;
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  border: 1px solid #e5e5e7;
}

.video-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
}

.video-card img {
  width: 100%;
  height: 140px;
  object-fit: cover;
  display: block;
  background: #f0f0f2;
}

.video-card .card-title {
  padding: 14px 16px;
  font-size: 14px;
  font-weight: 500;
  color: #1a1a1a;
  line-height: 1.4;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.loading {
  color: #9ca3af;
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  font-size: 15px;
}

/* DETAIL PAGE */
.detail-page {
  display: none;
  position: fixed;
  inset: 0;
  background: #f5f5f7;
  z-index: 200;
  overflow-y: auto;
  padding: 24px 32px 60px;
}

.detail-page.active {
  display: block;
}

.back-btn {
  background: #ffffff;
  color: #1a1a1a;
  border: 1px solid #e5e5e7;
  padding: 10px 18px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 24px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s;
}

.back-btn:hover {
  background: #1a1a1a;
  color: #ffffff;
  border-color: #1a1a1a;
}

.detail-container {
  max-width: 900px;
  margin: 0 auto;
}

.detail-thumb-wrap {
  position: relative;
  cursor: pointer;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
  background: #ffffff;
  border: 1px solid #e5e5e7;
}

.detail-thumb-wrap img {
  width: 100%;
  display: block;
  aspect-ratio: 16/9;
  object-fit: cover;
  background: #f0f0f2;
}

.play-btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 80px;
  height: 80px;
  background: rgba(255, 255, 255, 0.95);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #1a1a1a;
  transition: transform 0.2s, background 0.2s;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
}

.detail-thumb-wrap:hover .play-btn {
  transform: translate(-50%, -50%) scale(1.08);
  background: #ffffff;
}

#detailTitle {
  font-size: 26px;
  font-weight: 700;
  margin: 24px 0 16px;
  color: #1a1a1a;
  letter-spacing: -0.5px;
  line-height: 1.3;
}

.detail-desc {
  color: #4b5563;
  line-height: 1.8;
  font-size: 15px;
  white-space: pre-wrap;
  background: #ffffff;
  padding: 20px;
  border-radius: 10px;
  border: 1px solid #e5e5e7;
}

/* PLAYER MODAL (Full screen like YouTube) */
.player-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: #000000;
  z-index: 300;
  flex-direction: column;
}

.player-modal.active {
  display: flex;
}

.player-header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 20px;
  background: #0a0a0a;
  border-bottom: 1px solid #1f1f1f;
}

.player-back {
  background: transparent;
  border: none;
  color: #ffffff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
  border-radius: 6px;
  transition: background 0.2s;
}

.player-back:hover {
  background: #1f1f1f;
}

.player-title {
  color: #ffffff;
  font-size: 15px;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}

.player-body {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000000;
  padding: 0;
  overflow: hidden;
}

.player-body iframe,
.player-body video {
  width: 100%;
  height: 100%;
  border: none;
  background: #000;
}

.player-error {
  color: #ffffff;
  text-align: center;
  padding: 40px 20px;
  font-size: 15px;
  line-height: 1.6;
}

.player-error a {
  color: #60a5fa;
  text-decoration: underline;
  word-break: break-all;
}

.icon {
  width: 18px;
  height: 18px;
  stroke-width: 2;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.icon-lg {
  width: 22px;
  height: 22px;
  stroke-width: 2;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.icon-xl {
  width: 26px;
  height: 26px;
  stroke-width: 2;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.play-icon {
  width: 28px;
  height: 28px;
  fill: currentColor;
  margin-left: 4px;
}

@media (max-width: 600px) {
  .header { padding: 14px 18px; }
  .nav-tabs { padding: 12px 18px; }
  .section { padding: 20px 18px; }
  .video-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .video-card img { height: 110px; }
  .detail-page { padding: 18px 16px 40px; }
  .detail-thumb-wrap .play-btn { width: 64px; height: 64px; }
  .play-icon { width: 22px; height: 22px; }
  #detailTitle { font-size: 20px; }
}
</style>
</head>
<body>

<header class="header">
  <div class="logo">
    <svg class="icon-lg" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 9l5 3-5 3V9z"/></svg>
    UPCODEZ <span>OTT</span>
  </div>
</header>

<nav class="nav-tabs">
  <button class="tab active" onclick="showSection('home')" id="homeTab">
    <svg class="icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>
    Home
  </button>
  <button class="tab" onclick="showSection('search')" id="searchTab">
    <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    Search
  </button>
</nav>

<section id="homeSection" class="section active">
  <h2 class="section-title">All Videos</h2>
  <div id="homeGrid" class="video-grid">
    <p class="loading">Loading videos...</p>
  </div>
</section>

<section id="searchSection" class="section">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search videos by title...">
    <button onclick="performSearch()" aria-label="Search">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    </button>
  </div>
  <div id="searchGrid" class="video-grid">
    <p class="loading">Type something to search...</p>
  </div>
</section>

<div id="detailPage" class="detail-page">
  <button class="back-btn" onclick="closeDetail()">
    <svg class="icon" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back
  </button>
  <div class="detail-container">
    <div class="detail-thumb-wrap" onclick="playVideo()">
      <img id="detailThumb" src="" alt="thumbnail">
      <div class="play-btn">
        <svg class="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
    </div>
    <h1 id="detailTitle"></h1>
    <p id="detailDesc" class="detail-desc"></p>
  </div>
</div>

<div id="playerModal" class="player-modal">
  <div class="player-header">
    <button class="player-back" onclick="closePlayer()" aria-label="Back">
      <svg class="icon-xl" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div class="player-title" id="playerTitle"></div>
  </div>
  <div class="player-body" id="playerBody"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDMI4Hx65V5yQjxlafsaLE6Z9ovH-UsUQ8",
  authDomain: "upcodez-ott.firebaseapp.com",
  databaseURL: "https://upcodez-ott-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "upcodez-ott",
  storageBucket: "upcodez-ott.firebasestorage.app",
  messagingSenderId: "162177320042",
  appId: "1:162177320042:web:b9bd09b99d5e9ff2b17613",
  measurementId: "G-TQYMW0LCH7"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let allVideos = [];
let currentVideo = null;

onValue(ref(db, 'videos'), (snapshot) => {
  allVideos = [];
  snapshot.forEach((child) => {
    allVideos.push({ id: child.key, ...child.val() });
  });
  allVideos.reverse();
  renderHome();
});

function renderHome() {
  const grid = document.getElementById('homeGrid');
  if (allVideos.length === 0) {
    grid.innerHTML = '<p class="loading">No videos available yet.</p>';
    return;
  }
  grid.innerHTML = allVideos.map(v => `
    <div class="video-card" onclick="openDetail('${v.id}')">
      <img src="${v.thumbnail}" alt="" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22200%22><rect width=%22300%22 height=%22200%22 fill=%22%23f0f0f2%22/></svg>'">
      <div class="card-title">${escapeHtml(v.title)}</div>
    </div>
  `).join('');
}

window.showSection = function(section) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('homeTab').classList.remove('active');
  document.getElementById('searchTab').classList.remove('active');

  if (section === 'home') {
    document.getElementById('homeSection').classList.add('active');
    document.getElementById('homeTab').classList.add('active');
  } else {
    document.getElementById('searchSection').classList.add('active');
    document.getElementById('searchTab').classList.add('active');
    setTimeout(() => document.getElementById('searchInput').focus(), 100);
  }
};

window.openDetail = function(id) {
  const video = allVideos.find(v => v.id === id);
  if (!video) return;
  currentVideo = video;

  document.getElementById('detailThumb').src = video.thumbnail;
  document.getElementById('detailTitle').textContent = video.title;
  document.getElementById('detailDesc').textContent = video.description || 'No description available.';
  document.getElementById('detailPage').classList.add('active');
  window.scrollTo(0, 0);
};

window.closeDetail = function() {
  document.getElementById('detailPage').classList.remove('active');
  currentVideo = null;
};

/* === BUILD EMBED URL === */
function buildEmbed(url) {
  if (!url) return null;
  url = url.trim();

  // YouTube: watch?v=ID
  let m = url.match(/youtube\.com\/watch\?v=([^&\s]+)/);
  if (m) return { type: 'iframe', src: `https://www.youtube.com/embed/${m[1]}?autoplay=1&rel=0` };

  // YouTube: youtu.be/ID
  m = url.match(/youtu\.be\/([^?&\s]+)/);
  if (m) return { type: 'iframe', src: `https://www.youtube.com/embed/${m[1]}?autoplay=1&rel=0` };

  // YouTube Shorts
  m = url.match(/youtube\.com\/shorts\/([^?&\s]+)/);
  if (m) return { type: 'iframe', src: `https://www.youtube.com/embed/${m[1]}?autoplay=1&rel=0` };

  // Already embed URL
  if (url.includes('youtube.com/embed/')) {
    const sep = url.includes('?') ? '&' : '?';
    return { type: 'iframe', src: `${url}${sep}autoplay=1` };
  }

  // Vimeo
  m = url.match(/vimeo\.com\/(\d+)/);
  if (m) return { type: 'iframe', src: `https://player.vimeo.com/video/${m[1]}?autoplay=1` };

  // Google Drive
  m = url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
  if (m) return { type: 'iframe', src: `https://drive.google.com/file/d/${m[1]}/preview` };

  // Direct video file
  if (/\.(mp4|webm|ogg|mov|m3u8)(\?|$)/i.test(url)) {
    return { type: 'video', src: url };
  }

  // Fallback: try as iframe
  return { type: 'iframe', src: url };
}

window.playVideo = function() {
  if (!currentVideo) return;
  const body = document.getElementById('playerBody');
  const titleEl = document.getElementById('playerTitle');
  titleEl.textContent = currentVideo.title;

  const embed = buildEmbed(currentVideo.videoUrl);

  if (!embed) {
    body.innerHTML = `<div class="player-error">Invalid video URL.</div>`;
    document.getElementById('playerModal').classList.add('active');
    return;
  }

  if (embed.type === 'video') {
    body.innerHTML = `<video src="${embed.src}" controls autoplay playsinline></video>`;
  } else {
    body.innerHTML = `<iframe src="${embed.src}" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>`;
  }

  document.getElementById('playerModal').classList.add('active');
  // Lock body scroll
  document.body.style.overflow = 'hidden';
};

window.closePlayer = function() {
  document.getElementById('playerBody').innerHTML = '';
  document.getElementById('playerModal').classList.remove('active');
  document.body.style.overflow = '';
};

window.performSearch = function() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  const grid = document.getElementById('searchGrid');

  if (!query) {
    grid.innerHTML = '<p class="loading">Type something to search...</p>';
    return;
  }

  const results = allVideos.filter(v => v.title.toLowerCase().includes(query));

  if (results.length === 0) {
    grid.innerHTML = '<p class="loading">No videos found.</p>';
    return;
  }

  grid.innerHTML = results.map(v => `
    <div class="video-card" onclick="openDetail('${v.id}')">
      <img src="${v.thumbnail}" alt="" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22200%22><rect width=%22300%22 height=%22200%22 fill=%22%23f0f0f2%22/></svg>'">
      <div class="card-title">${escapeHtml(v.title)}</div>
    </div>
  `).join('');
};

document.getElementById('searchInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') performSearch();
});

// Esc key closes player or detail
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('playerModal').classList.contains('active')) {
      closePlayer();
    } else if (document.getElementById('detailPage').classList.contains('active')) {
      closeDetail();
    }
  }
});

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>"']/g, (m) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[m]);
}
</script>
</body>
</html>
