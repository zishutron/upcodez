        * { font-family: 'Inter', sans-serif; margin:0; padding:0; box-sizing:border-box; }
        body { transition: background-color 0.3s, color 0.3s; }
        
        [data-theme="dark"] {
            --bg: #0b0d0f;
            --bg-card: #14191f;
            --bg-card-hover: #1a2128;
            --bg-secondary: #1e242b;
            --text: #f0f2f5;
            --text-secondary: #b0b8c5;
            --text-muted: #8e98a8;
            --border: #232a32;
            --border-hover: #3a4553;
            --accent: #6c8cff;
            --accent-hover: #7f9bff;
            --shadow: 0 24px 48px -12px rgba(0,0,0,0.8);
        }
        [data-theme="light"] {
            --bg: #f5f7fa;
            --bg-card: #ffffff;
            --bg-card-hover: #f0f2f5;
            --bg-secondary: #e8ecf1;
            --text: #0b0d0f;
            --text-secondary: #4a525f;
            --text-muted: #6b7585;
            --border: #d0d5dd;
            --border-hover: #a0a8b5;
            --accent: #4a6cf7;
            --accent-hover: #5f7df8;
            --shadow: 0 24px 48px -12px rgba(0,0,0,0.15);
        }
        
        body { background-color: var(--bg); color: var(--text); }
        .card-bg { background-color: var(--bg-card); }
        .border-custom { border-color: var(--border); }
        .text-secondary { color: var(--text-secondary); }
        .text-muted { color: var(--text-muted); }
        .accent { color: var(--accent); }
        .accent-bg { background-color: var(--accent); }
        .accent-bg-hover:hover { background-color: var(--accent-hover); }

        /* Template Card */
        .template-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s;
        }
        .template-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow);
            border-color: var(--border-hover);
        }
        .template-card .preview-wrap {
            height: 200px;
            background: var(--bg-secondary);
            overflow: hidden;
            position: relative;
        }
        .template-card .preview-wrap iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none;
        }

        /* Modal - Full Screen Preview */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            max-width: 1200px;
            width: 100%;
            max-height: 92vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
        }
        .modal-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-secondary);
            flex-shrink: 0;
        }
        .modal-header h2 { font-size: 1.2rem; font-weight: 700; }
        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 8px;
            transition: 0.2s;
        }
        .modal-close:hover { background: var(--bg-card-hover); color: var(--text); }
        .modal-body {
            flex: 1;
            overflow: auto;
            padding: 0;
            background: var(--bg-secondary);
        }
        .modal-body iframe {
            width: 100%;
            height: 100%;
            min-height: 500px;
            border: none;
            background: var(--bg-secondary);
        }

        /* Checkout Panel (Slide-over) */
        .checkout-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 2000;
            display: none;
            justify-content: flex-end;
        }
        .checkout-overlay.active { display: flex; }
        .checkout-panel {
            background: var(--bg-card);
            width: 100%;
            max-width: 440px;
            height: 100%;
            padding: 32px;
            overflow-y: auto;
            border-left: 1px solid var(--border);
            box-shadow: -20px 0 60px rgba(0,0,0,0.4);
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .checkout-panel .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            float: right;
        }
        .checkout-panel h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
        .checkout-panel .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }
        .checkout-item {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }
        .checkout-item .price-row { display: flex; justify-content: space-between; font-weight: 600; }
        .checkout-total {
            border-top: 2px solid var(--border);
            padding-top: 16px;
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: 700;
        }
        .checkout-btn {
            width: 100%;
            padding: 14px;
            border-radius: 40px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 16px;
        }
        .checkout-btn:hover { background: var(--accent-hover); transform: scale(1.01); }

        .category-filter {
            cursor: pointer;
            transition: all 0.2s;
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            background: transparent;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .category-filter:hover, .category-filter.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .badge {
            background: var(--bg);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .theme-btn { background: transparent; border: none; cursor: pointer; padding: 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); transition: 0.2s; }
        .theme-btn:hover { background: var(--bg-card-hover); color: var(--text); }

        @media (max-width: 640px) {

            .modal-content { max-height: 95vh; }
            .modal-body iframe { min-height: 300px; }
        }
    </style>
</head>

                    price: 649, license: { personal: 649, commercial: 1049 }, free: false, slug: 'echo',
                    html: `<div style="background:#f5f7fa;color:#0b0d0f;font-family:sans-serif;padding:16px;height:100%;min-height:100vh;">
                        <div style="display:flex;gap:16px;border-bottom:1px solid #d0d5dd;padding-bottom:12px;">

            // ----- DOM refs -----
            const grid = document.getElementById('templateGrid');
            const categoryBtns = document.querySelectorAll('.category-filter');
            const resultCount = document.getElementById('resultCount');
            
            // Preview Modal
            const previewModal = document.getElementById('previewModal');
            const previewIframe = document.getElementById('previewIframe');
            const previewTitle = document.getElementById('previewTitle');
            const previewClose = document.getElementById('previewClose');
            
            // Checkout
            const checkoutOverlay = document.getElementById('checkoutOverlay');
            const checkoutClose = document.getElementById('checkoutClose');
            const checkoutContent = document.getElementById('checkoutContent');

            // ----- Theme -----
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const html = document.documentElement;

            function setTheme(theme) {
                html.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
                themeIcon.innerHTML = theme === 'dark' 
                    ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
                    : '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
            }
            const savedTheme = localStorage.getItem('theme') || 'dark';
            setTheme(savedTheme);

            themeToggle.addEventListener('click', () => {
                const current = html.getAttribute('data-theme');
                setTheme(current === 'dark' ? 'light' : 'dark');
            });

            // ----- Render templates -----
            function renderTemplates(filterCategory = 'all') {
                const filtered = filterCategory === 'all' ? templates : templates.filter(t => t.category === filterCategory);
                resultCount.textContent = `${filtered.length} templates`;

                if (filtered.length === 0) {
                    grid.innerHTML = `<div class="col-span-full text-center py-12 text-muted">No templates found in this category.</div>`;
                    return;
                }

                grid.innerHTML = filtered.map(tpl => `
                    <div class="template-card" data-slug="${tpl.slug}">
                        <div class="preview-wrap">
                            <iframe srcdoc="<!DOCTYPE html><html style='margin:0;padding:0;height:100%;background:var(--bg-secondary);'><head><style>body{margin:0;padding:0;height:100%;}</style></head><body>${tpl.html}</body></html>" style="width:100%;height:100%;border:none;pointer-events:none;"></iframe>
                        </div>
                        <div class="p-4">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="font-bold text-lg">${tpl.name}</h3>
                                    <p class="text-sm text-muted">${tpl.desc}</p>
                                </div>
                                <span class="text-sm font-bold">${tpl.free ? 'Free' : '₹' + tpl.price}</span>
                            </div>
                            <div class="flex flex-wrap gap-1 mt-2">
                                ${tpl.tech.slice(0,3).map(t => `<span class="badge">${t}</span>`).join('')}
                                ${tpl.tech.length > 3 ? `<span class="badge">+${tpl.tech.length - 3}</span>` : ''}
                            </div>
                            <div class="flex gap-2 mt-4">
                                <button class="preview-btn flex-1 px-3 py-1.5 text-sm font-semibold rounded-full border border-custom text-secondary hover:bg-[var(--bg-card-hover)] transition" data-slug="${tpl.slug}">Live Preview</button>
                                <button class="buy-btn flex-1 px-3 py-1.5 text-sm font-semibold rounded-full text-white accent-bg hover:bg-[var(--accent-hover)] transition" data-slug="${tpl.slug}">Get Template</button>
                            </div>
                        </div>
                    </div>
                `).join('');

                // Attach events
                document.querySelectorAll('.preview-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const slug = btn.dataset.slug;
                        const tpl = templates.find(t => t.slug === slug);
                        if (tpl) openPreview(tpl);
                    });
                });
                document.querySelectorAll('.buy-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const slug = btn.dataset.slug;
                        const tpl = templates.find(t => t.slug === slug);
                        if (tpl) openCheckout(tpl);
                    });
                });
                document.querySelectorAll('.template-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const slug = card.dataset.slug;
                        const tpl = templates.find(t => t.slug === slug);
                        if (tpl) openPreview(tpl);
                    });
                });
            }

            // ----- Full Screen Preview -----
            function openPreview(tpl) {
                previewTitle.textContent = `${tpl.name} — Live Preview`;
                previewIframe.srcdoc = `<!DOCTYPE html><html style='margin:0;padding:0;height:100%;background:var(--bg-secondary);'><head><style>body{margin:0;padding:0;height:100%;}</style></head><body>${tpl.html}</body></html>`;
                previewModal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closePreview() {
                previewModal.classList.remove('active');
                document.body.style.overflow = '';
                previewIframe.srcdoc = '';
            }

            previewClose.addEventListener('click', closePreview);
            previewModal.addEventListener('click', (e) => { if (e.target === previewModal) closePreview(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePreview(); });

            // ----- Checkout Panel -----
            function openCheckout(tpl) {
                const price = tpl.free ? 'Free' : `₹${tpl.price}`;
                checkoutContent.innerHTML = `
                    <div class="checkout-item">
                        <div style="font-weight:700;font-size:1.1rem;">${tpl.name}</div>
                        <div style="color:var(--text-muted);font-size:0.8rem;">${tpl.desc}</div>
                        <div class="price-row" style="margin-top:8px;">
                            <span>Price</span>
                            <span>${price}</span>
                        </div>
                    </div>
                    <div style="margin:16px 0;">
                        <div style="font-weight:600;margin-bottom:8px;">License</div>
                        <div class="license-toggle" id="checkoutLicense">
                            <button class="active" data-license="personal">Personal</button>
                            <button data-license="commercial">Commercial</button>
                        </div>
                    </div>
                    <div class="checkout-total">
                        <span>Total</span>
                        <span id="checkoutTotal">${price}</span>
                    </div>
                    <button class="checkout-btn" id="checkoutPayBtn">
                        ${tpl.free ? 'Download Free Template' : `Pay ${price}`}
                    </button>
                    <div style="text-align:center;margin-top:12px;font-size:0.7rem;color:var(--text-muted);">
                        ✓ Secure checkout • Lifetime access • Complete source code
                    </div>
                `;

                // License toggle
                const toggleBtns = checkoutContent.querySelectorAll('#checkoutLicense button');
                const totalSpan = checkoutContent.querySelector('#checkoutTotal');
                const payBtn = checkoutContent.querySelector('#checkoutPayBtn');

                toggleBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        toggleBtns.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        const license = btn.dataset.license;
                        const newPrice = tpl.free ? 'Free' : `₹${tpl.license[license]}`;
                        totalSpan.textContent = newPrice;
                        payBtn.textContent = tpl.free ? 'Download Free Template' : `Pay ${newPrice}`;
                    });
                });

                checkoutOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeCheckout() {
                checkoutOverlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            checkoutClose.addEventListener('click', closeCheckout);
            checkoutOverlay.addEventListener('click', (e) => { if (e.target === checkoutOverlay) closeCheckout(); });

            // ----- Category Filter -----
            categoryBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    categoryBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderTemplates(btn.dataset.category);
                });
            });

            // Initial render
            renderTemplates('all');
        })();
    </script>
