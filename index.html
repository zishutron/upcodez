        * { font-family: 'Inter', sans-serif; }
        body { transition: background-color 0.3s, color 0.3s; margin:0; padding:0; }
        
        [data-theme="dark"] {
            --bg: #0b0d0f;
            --bg-card: #14191f;
            --bg-card-hover: #1a2128;
            --bg-secondary: #1e242b;
            --text: #f0f2f5;
            --text-secondary: #b0b8c5;
            --text-muted: #8e98a8;
            --border: #232a32;
            --border-hover: #3a4553;
            --accent: #6c8cff;
            --accent-hover: #7f9bff;
            --shadow: 0 24px 48px -12px rgba(0,0,0,0.8);
        }
        [data-theme="light"] {
            --bg: #f5f7fa;
            --bg-card: #ffffff;
            --bg-card-hover: #f0f2f5;
            --bg-secondary: #e8ecf1;
            --text: #0b0d0f;
            --text-secondary: #4a525f;
            --text-muted: #6b7585;
            --border: #d0d5dd;
            --border-hover: #a0a8b5;
            --accent: #4a6cf7;
            --accent-hover: #5f7df8;
            --shadow: 0 24px 48px -12px rgba(0,0,0,0.15);
        }
        
        body {
            background-color: var(--bg);
            color: var(--text);
        }
        .card-bg { background-color: var(--bg-card); }
        .card-hover:hover { background-color: var(--bg-card-hover); }
        .border-custom { border-color: var(--border); }
        .text-secondary { color: var(--text-secondary); }
        .text-muted { color: var(--text-muted); }
        .shadow-custom { box-shadow: var(--shadow); }
        .accent { color: var(--accent); }
        .accent-bg { background-color: var(--accent); }
        .accent-border { border-color: var(--accent); }
        .accent-bg-hover:hover { background-color: var(--accent-hover); }

        .template-card {
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
        }
        .template-card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: var(--shadow);
            border-color: var(--border-hover);
        }
        .template-card .preview-wrap {
            height: 180px;
            background: var(--bg-secondary);
            overflow: hidden;
            position: relative;
        }
        .template-card .preview-wrap iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            max-width: 1100px;
            width: 100%;
            max-height: 90vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
        }
        .modal-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-secondary);
        }
        .modal-body {
            flex: 1;
            overflow: hidden;
            padding: 0;
        }
        .modal-body iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: var(--bg-secondary);
        }

        .category-filter {
            cursor: pointer;
            transition: all 0.2s;
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            background: transparent;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .category-filter:hover, .category-filter.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .license-toggle {
            display: flex;
            background: var(--bg);
            border-radius: 40px;
            padding: 4px;
            border: 1px solid var(--border);
        }
        .license-toggle button {
            padding: 6px 18px;
            border-radius: 30px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .license-toggle button.active {
            background: var(--accent);
            color: #fff;
        }

        .badge {
            background: var(--bg);

            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .badge-accent {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

                            </div>
                            <div class="flex flex-wrap gap-1 mt-2">
                                ${tpl.tech.slice(0,3).map(t => `<span class="badge">${t}</span>`).join('')}
                                ${tpl.tech.length > 3 ? `<span class="badge">+${tpl.tech.length - 3}</span>` : ''}
                            </div>
                            <div class="flex gap-2 mt-4">
                                <button class="preview-btn flex-1 px-3 py-1.5 text-sm font-semibold rounded-full border border-custom text-secondary hover:bg-[var(--bg-card-hover)] transition" data-slug="${tpl.slug}">Live Preview</button>
                                <button class="buy-btn flex-1 px-3 py-1.5 text-sm font-semibold rounded-full text-white accent-bg hover:bg-[var(--accent-hover)] transition" data-slug="${tpl.slug}">Get Template</button>
                            </div>
                        </div>
                    </div>
                `).join('');

                // Attach events
                document.querySelectorAll('.preview-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const slug = btn.dataset.slug;
                        const tpl = templates.find(t => t.slug === slug);
                        if (tpl) openFullPreview(tpl);
                    });
                });
                document.querySelectorAll('.buy-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const slug = btn.dataset.slug;
                        const tpl = templates.find(t => t.slug === slug);
                        if (tpl) openFullPreview(tpl);
                    });
                });
                document.querySelectorAll('.template-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const slug = card.dataset.slug;
                        const tpl = templates.find(t => t.slug === slug);
                        if (tpl) openFullPreview(tpl);
                    });
                });
            }

            // ----- Full Screen Preview -----
            function openFullPreview(tpl) {
                modalTitle.textContent = `${tpl.name} — Live Preview`;
                modalIframe.srcdoc = `<!DOCTYPE html><html style='margin:0;padding:0;height:100%;background:var(--bg-secondary);'><head><style>body{margin:0;padding:0;height:100%;}</style></head><body>${tpl.html}</body></html>`;
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeModal() {
                modal.classList.remove('active');
                document.body.style.overflow = '';
                modalIframe.srcdoc = '';
            }

            modalClose.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

            // ----- Category Filter -----
            categoryBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    categoryBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderTemplates(btn.dataset.category);
                });
            });

            // Initial render
            renderTemplates('all');
        })();
    </script>
</body>
</html>
