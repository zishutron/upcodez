            const url = URL.createObjectURL(blob);

        function renderProductDetail(product) {
            if (!product) return '<p>Product not found.</p>';
            const isFav = isFavorite(product.id);
            const inCart = isInCart(product.id);
            return `
            <div class="max-w-4xl mx-auto">
                <button data-view="catalog" class="text-gray-400 hover:text-emerald mb-4 flex items-center gap-1"><i data-lucide="arrow-left" class="w-4 h-4"></i> Back</button>
                <div class="bg-card rounded-xl border border-obsidian overflow-hidden p-6">
                    <div class="flex flex-wrap items-start justify-between">
                        <div>
                            <span class="text-emerald text-sm uppercase tracking-wider">${product.category}</span>
                            <h1 class="text-3xl font-bold">${product.name}</h1>
                            <p class="text-gray-400 mt-2">${product.longDescription || product.description}</p>
                            <div class="flex flex-wrap gap-2 mt-3">
                                ${product.technologies.map(t => `<span class="bg-obsidian px-3 py-1 rounded-full text-xs">${t}</span>`).join('')}
                            </div>
                            <div class="flex items-center gap-4 mt-3 text-sm text-gray-400">
                                <span><i data-lucide="star" class="w-4 h-4 inline text-emerald fill-emerald"></i> ${product.rating}</span>
                                <span><i data-lucide="download" class="w-4 h-4 inline"></i> ${product.downloads}</span>
                                <span>${product.pages.length} pages</span>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="text-2xl font-bold text-emerald">₹${product.price}</div>
                            ${product.originalPrice ? `<div class="text-sm text-gray-500 line-through">₹${product.originalPrice}</div>` : ''}
                            <div class="flex gap-2 mt-2">
                                <button data-fav="${product.id}" class="p-2 rounded-full border border-obsidian hover:border-emerald transition">
                                    <i data-lucide="${isFav ? 'heart' : 'heart'}" class="w-5 h-5 ${isFav ? 'text-emerald fill-emerald' : ''}"></i>
                                </button>
                                <button data-buy="${product.id}" class="btn-primary">${inCart ? 'In Cart' : 'Buy Now'}</button>
                            </div>
                        </div>
                    </div>
                    <div class="mt-6 grid grid-cols-2 md:grid-cols-3 gap-2">
                        ${product.pages.map(p => `<span class="bg-obsidian px-3 py-1 rounded-full text-xs text-center">${p}</span>`).join('')}
                    </div>
                    <div class="mt-6 flex flex-wrap gap-3">
                        <button data-preview="${product.id}" class="btn-secondary">Live Preview</button>
                        <button data-buy="${product.id}" class="btn-primary">Purchase</button>
                    </div>
                </div>
            </div>
            `;
        }

        // ---------- FAVORITES ----------
        function renderFavorites() {
            const favs = state.favorites.map(id => getProduct(id)).filter(Boolean);
            if (favs.length === 0) return `<div class="text-center py-12"><p class="text-gray-400">No saved websites yet.</p><button data-view="catalog" class="btn-primary mt-4">Browse websites</button></div>`;
            return `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">${favs.map(p => renderProductCard(p)).join('')}</div>`;
        }

        // ---------- PURCHASES ----------
        function renderPurchases() {
            const purchases = state.purchases;
            if (purchases.length === 0) return `<div class="text-center py-12"><p class="text-gray-400">Your purchased websites will appear here.</p><button data-view="catalog" class="btn-primary mt-4">Browse websites</button></div>`;
            return `
            <div class="space-y-4">
                ${purchases.map(p => `
                    <div class="bg-card rounded-xl border border-obsidian p-4 flex flex-wrap items-center justify-between">
                        <div>
                            <h3 class="font-bold">${p.productName}</h3>
                            <p class="text-sm text-gray-400">Order: ${p.id} • ${p.license} • ${new Date(p.date).toLocaleDateString()}</p>
                        </div>
                        <div class="flex gap-2">
                            <button data-download="${p.productId}" class="btn-primary text-sm py-1 px-4">Download Again</button>
                        </div>
                    </div>
                `).join('')}
            </div>
            `;
        }

        // ---------- ABOUT, LICENSE, FAQ ----------
        function renderAbout() {
            return `<div class="max-w-3xl mx-auto py-8"><h1 class="text-3xl font-bold">About UPCodez</h1><p class="mt-4 text-gray-300">UPCodez is a digital marketplace created to make complete website projects easier to discover, preview and use. Our mission is to help creators and developers start with a professional foundation instead of building everything from zero.</p><p class="mt-2 text-gray-400">All products are frontend source-code packages ready for customization.</p></div>`;
        }

        function renderLicensePage() {
            return `<div class="max-w-3xl mx-auto py-8"><h1 class="text-3xl font-bold">Licenses</h1><div class="mt-4 space-y-4"><div class="bg-card p-4 rounded border border-obsidian"><h3 class="font-bold">Personal License</h3><p class="text-gray-400">For personal projects. Non-commercial use only.</p></div><div class="bg-card p-4 rounded border border-obsidian"><h3 class="font-bold">Commercial License</h3><p class="text-gray-400">For business/client projects. Single project use.</p></div><div class="bg-card p-4 rounded border border-obsidian"><h3 class="font-bold">Extended License</h3><p class="text-gray-400">For broader commercial usage. Multiple projects.</p></div><p class="text-sm text-gray-500 mt-4">Please review the full license terms before purchase.</p></div></div>`;
        }

        function renderFaq() {
            return `<div class="max-w-3xl mx-auto py-8"><h1 class="text-3xl font-bold">FAQ</h1><div class="mt-4 space-y-2">${[
                ['What do I receive after purchasing?', 'You receive the complete website source code, including all pages, CSS, JS, assets, and documentation.'],
                ['Is the website responsive?', 'Yes, all websites are fully responsive and work on all devices.'],
                ['Can I customize the source code?', 'Absolutely. All source code is fully editable.'],
                ['Can I use it for a client?', 'Yes, with a Commercial or Extended License.'],
                ['What technologies are included?', 'Each product lists its technologies. Most include HTML, CSS, and JavaScript.'],
                ['Do I receive all pages?', 'Yes, every page listed in the product details is included.'],
                ['Does the ZIP include documentation?', 'Yes, a README and license file are included.'],
                ['Can I download it again?', 'Yes, from your purchases page.'],
                ['Can I resell the source code?', 'No, reselling is not permitted.'],
                ['Is payment real or simulated in this demo?', 'This is a demonstration — no real payment is processed.'],
                ['Can I use the website commercially?', 'With the appropriate license, yes.'],
                ['How do updates work?', 'Updates are provided via the changelog and re-download.']
            ].map(([q,a]) => `<div class="bg-card p-4 rounded border border-obsidian"><h4 class="font-bold">${q}</h4><p class="text-gray-400 text-sm">${a}</p></div>`).join('')}</div></div>`;
        }

        // ---------- FOOTER ----------
        function renderFooter() {
            return `
            <footer class="border-t border-obsidian mt-12 py-8 bg-obsidian">
                <div class="max-w-7xl mx-auto px-4 grid grid-cols-2 md:grid-cols-4 gap-6 text-sm">
                    <div><h5 class="font-bold text-emerald">Marketplace</h5><ul class="mt-2 space-y-1 text-gray-400"><li>All Websites</li><li>Free Websites</li><li>Popular</li><li>New Releases</li></ul></div>
                    <div><h5 class="font-bold text-cyan">Categories</h5><ul class="mt-2 space-y-1 text-gray-400"><li>SaaS</li><li>Business</li><li>Portfolio</li><li>E-commerce</li><li>Agency</li></ul></div>
                    <div><h5 class="font-bold text-indigo">Company</h5><ul class="mt-2 space-y-1 text-gray-400"><li><a href="#" data-view="about">About</a></li><li><a href="#" data-view="license-page">License</a></li><li><a href="#" data-view="faq">FAQ</a></li><li>support.stardustofficial@gmail.com</li></ul></div>
                    <div><h5 class="font-bold text-gray-300">Ecosystem</h5><p class="text-gray-400">ZISHU TRON</p></div>
                </div>
                <div class="text-center text-gray-500 text-xs mt-6 border-t border-obsidian pt-4">© 2025 UPCodez — Complete Ready-Made Websites</div>
            </footer>
            `;
        }

        // ---------- MODALS (cart, checkout, preview, command) ----------
        function renderModals() {
            return `
            ${renderCartDrawer()}
            ${renderCheckoutModal()}
            ${renderPreviewModal()}
            ${renderCommandModal()}
            `;
        }

        function renderCartDrawer() {
            const items = state.cart.map(id => getProduct(id)).filter(Boolean);
            const total = items.reduce((sum, p) => sum + p.price, 0);
            return `
            <div id="cart-drawer" class="fixed inset-0 z-50 ${state.cartOpen ? '' : 'pointer-events-none'}">
                <div class="absolute inset-0 bg-black/60 ${state.cartOpen ? 'opacity-100' : 'opacity-0'} transition-opacity" data-close-cart></div>
                <div class="absolute right-0 top-0 h-full w-full max-w-md bg-obsidian border-l border-obsidian shadow-2xl ${state.cartOpen ? 'translate-x-0' : 'translate-x-full'} transition-transform duration-300 flex flex-col">
                    <div class="flex items-center justify-between p-4 border-b border-obsidian">
                        <h3 class="text-xl font-bold">Your Cart</h3>
                        <button data-close-cart class="p-2 rounded-full hover:bg-card-hover"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    <div class="flex-1 overflow-y-auto p-4 space-y-3">
                        ${items.length === 0 ? '<p class="text-gray-400">Your cart is empty.</p>' : items.map(p => `
                            <div class="flex items-center justify-between bg-card p-3 rounded border border-obsidian">
                                <div><span class="font-medium">${p.name}</span><span class="text-emerald ml-2">₹${p.price}</span></div>
                                <button data-remove="${p.id}" class="text-red-400 hover:text-red-300"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                        `).join('')}
                    </div>
                    <div class="border-t border-obsidian p-4">
                        <div class="flex justify-between text-lg font-bold"><span>Total</span><span class="text-emerald">₹${total}</span></div>
                        <button data-checkout class="btn-primary w-full mt-3 ${items.length === 0 ? 'opacity-50 pointer-events-none' : ''}">Proceed to Checkout</button>
                    </div>
                </div>
            </div>
            `;
        }

        function renderCheckoutModal() {
            if (!state.checkoutOpen) return '';
            const items = state.cart.map(id => getProduct(id)).filter(Boolean);
            const total = items.reduce((sum, p) => sum + p.price, 0);
            const licenseOptions = ['Personal', 'Commercial', 'Extended'];
            return `
            <div class="fixed inset-0 z-50 flex items-center justify-center modal-bg">
                <div class="bg-obsidian rounded-xl border border-obsidian max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-2xl font-bold">Checkout</h2>
                        <button data-close-checkout class="p-2 rounded-full hover:bg-card-hover"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    <div class="flex items-center gap-2 mb-6">
                        <span class="step-dot active">1</span><span class="step-line completed"></span>
                        <span class="step-dot ${state.checkoutStep >= 2 ? 'completed' : ''}">2</span><span class="step-line ${state.checkoutStep >= 3 ? 'completed' : ''}"></span>
                        <span class="step-dot ${state.checkoutStep >= 3 ? 'completed' : ''}">3</span>
                    </div>
                    ${state.checkoutStep === 1 ? `
                        <div><h4 class="font-bold">Review your items</h4>${items.map(p => `<div class="flex justify-between py-2 border-b border-obsidian"><span>${p.name}</span><span>₹${p.price}</span></div>`).join('')}<div class="flex justify-between font-bold py-2"><span>Total</span><span>₹${total}</span></div>
                        <div class="mt-4"><label class="text-sm">License</label><select id="license-select" class="w-full bg-obsidian border-obsidian rounded p-2">${licenseOptions.map(l => `<option value="${l}">${l}</option>`).join('')}</select></div>
                        <button data-checkout-next class="btn-primary w-full mt-4">Next</button>
                    ` : ''}
                    ${state.checkoutStep === 2 ? `
                        <div><p class="text-gray-400">Demo checkout — no real payment is processed.</p>
                        <button data-checkout-pay class="btn-primary w-full mt-4">Complete Purchase</button>
                        <button data-checkout-back class="btn-secondary w-full mt-2">Back</button>
                    ` : ''}
                    ${state.checkoutStep === 3 ? `
                        <div class="text-center py-6"><i data-lucide="check-circle" class="w-16 h-16 text-emerald mx-auto"></i><h3 class="text-xl font-bold mt-2">Purchase Complete!</h3><p class="text-gray-400">Your website is ready for download.</p>
                        <button data-download-last class="btn-primary mt-4">Download ZIP</button>
                        <button data-close-checkout class="btn-secondary mt-2">Close</button>
                    ` : ''}
                </div>
            </div>
            `;
        }

        function renderPreviewModal() {
            if (!state.previewOpen || !state.previewProduct) return '';
            const p = getProduct(state.previewProduct);
            if (!p) return '';
            return `
            <div class="fixed inset-0 z-50 modal-bg flex items-center justify-center p-4">
                <div class="bg-obsidian rounded-xl border border-obsidian w-full max-w-6xl max-h-[90vh] overflow-hidden">
                    <div class="flex items-center justify-between p-3 border-b border-obsidian">
                        <div class="flex items-center gap-2">
                            <span class="text-sm font-medium">${p.name}</span>
                            <span class="text-xs text-gray-500">${p.category}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button data-device="desktop" class="device-btn ${state.previewDevice === 'desktop' ? 'active' : ''} p-1.5 rounded"><i data-lucide="monitor" class="w-4 h-4"></i></button>
                            <button data-device="tablet" class="device-btn ${state.previewDevice === 'tablet' ? 'active' : ''} p-1.5 rounded"><i data-lucide="tablet" class="w-4 h-4"></i></button>
                            <button data-device="mobile" class="device-btn ${state.previewDevice === 'mobile' ? 'active' : ''} p-1.5 rounded"><i data-lucide="smartphone" class="w-4 h-4"></i></button>
                            <button data-preview-fullscreen class="p-1.5 rounded hover:bg-card-hover"><i data-lucide="maximize" class="w-4 h-4"></i></button>
                            <button data-preview-newtab class="p-1.5 rounded hover:bg-card-hover"><i data-lucide="external-link" class="w-4 h-4"></i></button>
                            <button data-close-preview class="p-1.5 rounded hover:bg-card-hover"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                    </div>
                    <div class="p-2 bg-obsidian flex items-center justify-center" style="height:70vh;">
                        <div class="bg-obsidian border border-obsidian rounded overflow-hidden" style="width:${state.previewDevice === 'mobile' ? '375px' : state.previewDevice === 'tablet' ? '768px' : '100%'}; height:100%;">
                            <iframe srcdoc="${encodeURIComponent(p.sourceFiles.find(f => f.path === 'index.html')?.content || '<h1>Preview</h1>')}" class="w-full h-full border-0" sandbox="allow-scripts allow-forms"></iframe>
                        </div>
                    </div>
                </div>
            </div>
            `;
        }

        function renderCommandModal() {
            if (!state.commandOpen) return '';
            return `
            <div class="fixed inset-0 z-50 modal-bg flex items-start justify-center pt-20">
                <div class="bg-obsidian rounded-xl border border-obsidian max-w-2xl w-full p-4">
                    <input type="text" id="command-input" placeholder="Search or type a command..." class="w-full bg-obsidian border-obsidian rounded p-3 text-lg focus:ring-0" autofocus>
                    <div class="mt-2 text-sm text-gray-400">Commands: search, cart, favorites, purchases, about, faq</div>
                    <button data-close-command class="mt-2 text-gray-500 hover:text-gray-300">Close (ESC)</button>
                </div>
            </div>
            `;
        }

        // ---------- TOAST ----------
        function renderToast() {
            if (!state.toast) return '';
            return `<div class="fixed bottom-4 right-4 z-50 toast bg-card border border-obsidian rounded-xl px-6 py-3 shadow-2xl max-w-sm">${state.toast.message}</div>`;
        }

        // ---------- BIND EVENTS ----------
        function bindEvents() {
            // Navigation
            document.querySelectorAll('[data-view]').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.preventDefault();
                    const view = el.dataset.view;
                    state.currentView = view;
                    if (view === 'home') { state.currentProduct = null; }
                    renderApp();
                });
            });

            // Search
            document.querySelector('[data-action="search-go"]')?.addEventListener('click', () => {
                const input = document.getElementById('search-input');
                if (input) { state.searchQuery = input.value; state.currentView = 'catalog'; renderApp(); }
            });
            document.querySelector('#search-input')?.addEventListener('keydown', (e) => { if (e.key === 'Enter') { document.querySelector('[data-action="search-go"]')?.click(); } });
            document.querySelector('#catalog-search')?.addEventListener('input', (e) => { state.searchQuery = e.target.value; renderApp(); });

            // Popular search links
            document.querySelectorAll('[data-search]').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.preventDefault();
                    state.searchQuery = el.dataset.search;
                    state.currentView = 'catalog';
                    renderApp();
                });
            });

            // Filters
            document.querySelector('#filter-category')?.addEventListener('change', (e) => { state.selectedCategory = e.target.value; renderApp(); });
            document.querySelector('#filter-tech')?.addEventListener('change', (e) => { state.selectedTech = e.target.value; renderApp(); });
            document.querySelector('#filter-sort')?.addEventListener('change', (e) => { state.sortBy = e.target.value; renderApp(); });

            // Favorites
            document.querySelector('[data-action="favorites"]')?.addEventListener('click', () => { state.currentView = 'favorites'; renderApp(); });
            document.querySelector('[data-action="cart"]')?.addEventListener('click', () => { state.cartOpen = !state.cartOpen; renderApp(); });
            document.querySelector('[data-action="purchases"]')?.addEventListener('click', () => { state.currentView = 'purchases'; renderApp(); });

            // Theme
            document.querySelector('[data-action="theme"]')?.addEventListener('click', () => {
                state.theme = state.theme === 'dark' ? 'light' : 'dark';
                document.documentElement.classList.toggle('dark', state.theme === 'dark');
                saveState();
                renderApp();
            });

            // Product actions (delegated)
            document.addEventListener('click', (e) => {
                const target = e.target.closest('button');
                if (!target) return;

                if (target.dataset.fav) {
                    toggleFavorite(target.dataset.fav);
                }
                if (target.dataset.buy) {
                    const id = target.dataset.buy;
                    addToCart(id);
                    // open checkout
                    state.checkoutOpen = true;
                    state.checkoutStep = 1;
                    renderApp();
                }
                if (target.dataset.preview) {
                    state.previewProduct = target.dataset.preview;
                    state.previewOpen = true;
                    state.previewDevice = 'desktop';
                    renderApp();
                }
                if (target.dataset.remove) {
                    removeFromCart(target.dataset.remove);
                }
                if (target.dataset.checkout) {
                    state.checkoutOpen = true;
                    state.checkoutStep = 1;
                    renderApp();
                }
                if (target.dataset.download) {
                    generateDownload(target.dataset.download);
                }
                if (target.dataset.downloadLast) {
                    const items = state.cart.map(id => getProduct(id)).filter(Boolean);
                    if (items.length > 0) generateDownload(items[0].id);
                }
                if (target.dataset.closeCart) {
                    state.cartOpen = false;
                    renderApp();
                }
                if (target.dataset.closeCheckout) {
                    state.checkoutOpen = false;
                    state.checkoutStep = 1;
                    renderApp();
                }
                if (target.dataset.closePreview) {
                    state.previewOpen = false;
                    renderApp();
                }
                if (target.dataset.checkoutNext) {
                    state.checkoutStep = 2;
                    renderApp();
                }
                if (target.dataset.checkoutPay) {
                    const items = state.cart.map(id => getProduct(id)).filter(Boolean);
                    if (items.length > 0) {
                        const license = document.getElementById('license-select')?.value || 'Personal';
                        items.forEach(p => processPurchase(p.id, license));
                        state.cart = [];
                        saveState();
                        state.checkoutStep = 3;
                        renderApp();
                    }
                }
                if (target.dataset.checkoutBack) {
                    state.checkoutStep = 1;
                    renderApp();
                }
                if (target.dataset.device) {
                    state.previewDevice = target.dataset.device;
                    renderApp();
                }
                if (target.dataset.previewFullscreen) {
                    const previewEl = document.querySelector('#preview-frame');
                    if (previewEl) {
                        if (document.fullscreenElement) document.exitFullscreen();
                        else previewEl.requestFullscreen?.();
                    }
                }
                if (target.dataset.previewNewtab) {
                    const p = getProduct(state.previewProduct);
                    if (p) {
                        const content = p.sourceFiles.find(f => f.path === 'index.html')?.content || '<h1>Preview</h1>';
                        const blob = new Blob([content], { type: 'text/html' });
                        const url = URL.createObjectURL(blob);
                        window.open(url, '_blank');
                        setTimeout(() => URL.revokeObjectURL(url), 1000);
                    }
                }
                if (target.dataset.closeCommand) {
                    state.commandOpen = false;
                    renderApp();
                }
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                    e.preventDefault();
                    state.commandOpen = !state.commandOpen;
                    renderApp();
                    if (state.commandOpen) setTimeout(() => document.getElementById('command-input')?.focus(), 100);
                }
                if (e.key === 'Escape') {
                    if (state.commandOpen) { state.commandOpen = false; renderApp(); }
                    if (state.previewOpen) { state.previewOpen = false; renderApp(); }
                    if (state.cartOpen) { state.cartOpen = false; renderApp(); }
                }
                if (e.key === '/' && !['INPUT', 'TEXTAREA'].includes(e.target.tagName)) {
                    e.preventDefault();
                    state.commandOpen = true;
                    renderApp();
                    setTimeout(() => document.getElementById('command-input')?.focus(), 100);
                }
            });

            // Command input
            document.getElementById('command-input')?.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const val = e.target.value.toLowerCase();
                    if (val.includes('cart')) { state.cartOpen = true; state.commandOpen = false; renderApp(); }
                    else if (val.includes('favorites')) { state.currentView = 'favorites'; state.commandOpen = false; renderApp(); }
                    else if (val.includes('purchases')) { state.currentView = 'purchases'; state.commandOpen = false; renderApp(); }
                    else if (val.includes('about')) { state.currentView = 'about'; state.commandOpen = false; renderApp(); }
                    else if (val.includes('faq')) { state.currentView = 'faq'; state.commandOpen = false; renderApp(); }
                    else { state.searchQuery = val; state.currentView = 'catalog'; state.commandOpen = false; renderApp(); }
                }
            });
        }

        // ---------- INIT ----------
        function init() {
            document.documentElement.classList.toggle('dark', state.theme === 'dark');
            renderApp();
        }

        init();
    })();
</script>
</body>
</html>
