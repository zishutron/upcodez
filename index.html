<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UpCodez — Premium Website Templates</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { transition: background-color 0.3s, color 0.3s; }
        [data-theme="dark"] {
            --bg: #0b0d0f;
            --bg-card: #14191f;
            --bg-card-hover: #1a2128;
            --text: #f0f2f5;
            --text-secondary: #b0b8c5;
            --text-muted: #8e98a8;
            --border: #232a32;
            --border-hover: #3a4553;
            --accent: #6c8cff;
            --shadow: 0 24px 48px -12px rgba(0,0,0,0.8);
        }
        [data-theme="light"] {
            --bg: #f5f7fa;
            --bg-card: #ffffff;
            --bg-card-hover: #f0f2f5;
            --text: #0b0d0f;
            --text-secondary: #4a525f;
            --text-muted: #6b7585;
            --border: #d0d5dd;
            --border-hover: #a0a8b5;
            --accent: #4a6cf7;
            --shadow: 0 24px 48px -12px rgba(0,0,0,0.15);
        }
        body {
            background-color: var(--bg);
            color: var(--text);
        }
        .card-bg { background-color: var(--bg-card); }
        .card-hover:hover { background-color: var(--bg-card-hover); }
        .border-custom { border-color: var(--border); }
        .text-secondary { color: var(--text-secondary); }
        .text-muted { color: var(--text-muted); }
        .shadow-custom { box-shadow: var(--shadow); }
        .accent { color: var(--accent); }
        .accent-bg { background-color: var(--accent); }
        .accent-border { border-color: var(--accent); }
        .accent-bg-hover:hover { background-color: var(--accent); }

        .glass {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
        }
        [data-theme="light"] .glass {
            background: rgba(0,0,0,0.03);
            border: 1px solid rgba(0,0,0,0.06);
        }

        .template-card {
            transition: transform 0.25s ease, box-shadow 0.25s ease, background-color 0.25s;
        }
        .template-card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: var(--shadow);
        }
        .template-card .card-img iframe {
            pointer-events: none;
            transform: scale(0.85);
            transform-origin: top left;
            width: calc(100% / 0.85);
            height: calc(100% / 0.85);
            border: none;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 32px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.5);
        }

        .skeleton {
            background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-card-hover) 50%, var(--bg-card) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 12px;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .category-filter {
            cursor: pointer;
            transition: all 0.2s;
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            background: transparent;
        }
        .category-filter:hover, .category-filter.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .license-toggle {
            display: flex;
            background: var(--bg);
            border-radius: 40px;
            padding: 4px;
            border: 1px solid var(--border);
        }
        .license-toggle button {
            padding: 6px 18px;
            border-radius: 30px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .license-toggle button.active {
            background: var(--accent);
            color: #fff;
        }

        .badge {
            background: var(--bg);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .badge-accent {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        @media (max-width: 640px) {
            .modal-content { padding: 20px; }
        }
    </style>
</head>

                    'launch': `<div style="background:#0b0d0f;color:#f0f2f5;padding:12px;height:100%;"><div style="border-bottom:1px solid #1e2227;padding-bottom:6px;display:flex;justify-content:space-between;"><div style="font-weight:700;">GRID</div><div style="font-size:0.6rem;color:#8e98a8;">Problem · Solution</div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px;"><div style="background:#14191f;padding:6px;border-radius:4px;border:1px solid #232a32;font-size:0.6rem;">Problem</div><div style="background:#14191f;padding:6px;border-radius:4px;border:1px solid #232a32;font-size:0.6rem;">Solution</div></div></div>`,
                    'futuristic': `<div style="background:#0a0c10;color:#f0f2f5;padding:12px;height:100%;"><div style="border-bottom:2px solid #6c8cff;padding-bottom:6px;display:flex;justify-content:space-between;"><div style="font-weight:800;color:#6c8cff;">NEXUS</div><div style="font-size:0.6rem;color:#8e98a8;">Tech · Roadmap</div></div><div style="margin-top:12px;font-size:1.4rem;font-weight:700;">Future of tech</div></div>`,
                    'corporate': `<div style="background:#f5f7fa;color:#0b0d0f;padding:12px;height:100%;"><div style="border-bottom:2px solid #0b0d0f;padding-bottom:6px;display:flex;justify-content:space-between;"><div style="font-weight:700;">ATLAS</div><div style="font-size:0.6rem;">Services · Industries</div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px;"><div style="background:#fff;padding:6px;border-radius:4px;border:1px solid #d0d5dd;font-size:0.6rem;">Consulting</div><div style="background:#fff;padding:6px;border-radius:4px;border:1px solid #d0d5dd;font-size:0.6rem;">Solutions</div></div></div>`,
                    'agency': `<div style="background:#fff;color:#0b0d0f;padding:12px;height:100%;"><div style="border-bottom:3px solid #0b0d0f;padding-bottom:6px;display:flex;justify-content:space-between;"><div style="font-weight:800;">FORGE</div><div style="font-size:0.6rem;">Work · Process</div></div><div style="margin-top:12px;font-size:1.2rem;font-weight:700;">Digital agency</div></div>`,
                    'admin': `<div style="background:#0b0d0f;color:#f0f2f5;padding:8px;height:100%;"><div style="display:flex;gap:6px;border-bottom:1px solid #1e2227;padding-bottom:4px;"><span style="background:#1a2028;padding:2px 6px;border-radius:4px;font-size:0.5rem;">Admin</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px;"><div style="background:#14191f;padding:4px;border-radius:4px;border:1px solid #232a32;font-size:0.6rem;">23 projects</div><div style="background:#14191f;padding:4px;border-radius:4px;border:1px solid #232a32;font-size:0.6rem;">$4,230</div></div></div>`,
                    'finance': `<div style="background:#0b0d0f;color:#f0f2f5;padding:8px;height:100%;"><div style="border-bottom:1px solid #1e2227;padding-bottom:4px;display:flex;gap:6px;"><span style="font-weight:600;font-size:0.6rem;">QUANT</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px;"><div style="background:#14191f;padding:4px;border-radius:4px;border:1px solid #232a32;font-size:0.6rem;color:#4a6cf7;">+12.4%</div><div style="background:#14191f;padding:4px;border-radius:4px;border:1px solid #232a32;font-size:0.6rem;">$8,450</div></div></div>`,
                    'visual': `<div style="background:#fff;color:#0b0d0f;padding:12px;height:100%;"><div style="border-bottom:1px solid #d0d5dd;padding-bottom:6px;display:flex;justify-content:space-between;"><div style="font-weight:700;">FRAME</div><div style="font-size:0.6rem;">Work · Studio</div></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:8px;"><div style="background:#e8ecf1;aspect-ratio:1;border-radius:4px;"></div><div style="background:#d0d5dd;aspect-ratio:1;border-radius:4px;"></div><div style="background:#e8ecf1;aspect-ratio:1;border-radius:4px;"></div></div></div>`,
                    'photo': `<div style="background:#0b0d0f;color:#f0f2f5;padding:12px;height:100%;"><div style="border-bottom:1px solid #1e2227;padding-bottom:6px;display:flex;justify-content:space-between;"><div style="font-weight:700;">LENS</div><div style="font-size:0.6rem;color:#8e98a8;">Portfolio</div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px;"><div style="background:#1a2028;aspect-ratio:4/3;border-radius:4px;"></div><div style="background:#1a2028;aspect-ratio:4/3;border-radius:4px;"></div></div></div>`,
                    'docs': `<div style="background:#f5f7fa;color:#0b0d0f;padding:8px;height:100%;"><div style="display:flex;gap:6px;border-bottom:1px solid #d0d5dd;padding-bottom:4px;"><span style="font-weight:700;font-size:0.8rem;">ECHO</span><span style="color:#4a525f;font-size:0.5rem;">Docs</span></div><div style="margin-top:4px;background:#fff;padding:4px;border-radius:4px;border:1px solid #d0d5dd;font-size:0.5rem;">Installation guide</div></div>`
                };
                return designs[tpl.design] || designs['minimal'];
            }

            function renderTemplates(filterCategory = 'all') {
                const filtered = filterCategory === 'all' ? templates : templates.filter(t => t.category === filterCategory);
                resultCount.textContent = `${filtered.length} templates`;

                if (filtered.length === 0) {
                    grid.innerHTML = `<div class="col-span-full text-center py-12 text-muted">No templates found in this category.</div>`;
                    return;
                }

                grid.innerHTML = filtered.map(tpl => `
                    <div class="template-card card-bg border border-custom rounded-2xl overflow-hidden cursor-pointer" data-slug="${tpl.slug}">
                        <div class="card-img relative" style="height:160px; background:var(--bg);">
                            <iframe srcdoc="<!DOCTYPE html><html style='margin:0;padding:0;height:100%;background:var(--bg-secondary);'><head><style>body{margin:0;padding:0;height:100%;}</style></head><body>${getPreviewHTML(tpl)}</body></html>" style="width:100%;height:100%;border:none;pointer-events:none;transform:scale(0.85);transform-origin:top left;width:calc(100%/0.85);height:calc(100%/0.85);"></iframe>
                        </div>
                        <div class="p-4">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="font-bold text-lg">${tpl.name}</h3>
                                    <p class="text-sm text-muted">${tpl.desc}</p>
                                </div>
                                <span class="text-sm font-bold">${tpl.free ? 'Free' : '₹' + tpl.price}</span>
                            </div>
                            <div class="flex flex-wrap gap-1 mt-2">
                                ${tpl.tech.slice(0,3).map(t => `<span class="badge">${t}</span>`).join('')}
                                ${tpl.tech.length > 3 ? `<span class="badge">+${tpl.tech.length - 3}</span>` : ''}
                            </div>
                            <div class="flex gap-2 mt-4">
                                <button class="preview-btn flex-1 px-3 py-1.5 text-sm font-semibold rounded-full border border-custom text-secondary hover:bg-[var(--bg-card-hover)] transition" data-slug="${tpl.slug}">Live Preview</button>
                                <button class="buy-btn flex-1 px-3 py-1.5 text-sm font-semibold rounded-full text-white accent-bg hover:bg-[var(--accent-hover)] transition" data-slug="${tpl.slug}">Get Template</button>
                            </div>
                        </div>
                    </div>
                `).join('');

                // Attach events
                document.querySelectorAll('.preview-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const slug = btn.dataset.slug;
                        const tpl = templates.find(t => t.slug === slug);
                        if (tpl) openModal(tpl);
                    });
                });
                document.querySelectorAll('.buy-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const slug = btn.dataset.slug;
                        const tpl = templates.find(t => t.slug === slug);
                        if (tpl) openModal(tpl);
                    });
                });
                document.querySelectorAll('.template-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const slug = card.dataset.slug;
                        const tpl = templates.find(t => t.slug === slug);
                        if (tpl) openModal(tpl);
                    });
                });
            }

            // ----- Category Filter -----
            categoryBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    categoryBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const category = btn.dataset.category;
                    renderTemplates(category);
                });
            });

            // ----- Modal -----
            let currentLicense = 'personal';

            function openModal(tpl) {
                currentLicense = 'personal';
                modalTitle.textContent = tpl.name;
                const price = tpl.free ? 'Free' : `₹${tpl.price}`;
                const licensePrice = tpl.free ? 'Free' : `₹${tpl.license.personal}`;

                modalBody.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <div class="card-bg border border-custom rounded-xl p-4" style="min-height:180px;">
                                <iframe srcdoc="<!DOCTYPE html><html style='margin:0;padding:0;height:100%;background:var(--bg-secondary);'><head><style>body{margin:0;padding:0;height:100%;}</style></head><body>${getPreviewHTML(tpl)}</body></html>" style="width:100%;height:160px;border:none;border-radius:8px;"></iframe>
                            </div>
                            <div class="mt-4">
                                <h4 class="font-semibold text-sm mb-2">Tech Stack</h4>
                                <div class="flex flex-wrap gap-2">
                                    ${tpl.tech.map(t => `<span class="badge badge-accent">${t}</span>`).join('')}
                                </div>
                            </div>
                            <div class="mt-4">
                                <h4 class="font-semibold text-sm mb-2">Key Features</h4>
                                <ul class="space-y-1 text-sm text-secondary">
                                    ${tpl.features.map(f => `<li class="flex items-center gap-2">✓ ${f}</li>`).join('')}
                                </ul>
                            </div>
                        </div>
                        <div>
                            <div class="card-bg border border-custom rounded-xl p-4">
                                <h4 class="font-bold text-lg">${tpl.name}</h4>
                                <p class="text-sm text-muted">${tpl.desc}</p>
                                <div class="mt-4">
                                    <div class="license-toggle" id="licenseToggle">
                                        <button class="active" data-license="personal">Personal</button>
                                        <button data-license="commercial">Commercial</button>
                                    </div>
                                    <div class="mt-4 text-center">
                                        <div class="text-3xl font-bold" id="priceDisplay">${tpl.free ? 'Free' : '₹' + tpl.license.personal}</div>
                                        <div class="text-xs text-muted">${tpl.free ? 'Free for personal use' : 'One-time payment · Lifetime access'}</div>
                                    </div>
                                    <button class="w-full mt-4 py-3 rounded-full text-white accent-bg hover:bg-[var(--accent-hover)] transition font-semibold">Buy Now — ${tpl.free ? 'Download Free' : '₹' + (tpl.license.personal)}</button>
                                    <p class="text-xs text-center text-muted mt-2">✓ Complete source code ✓ Lifetime access ✓ Future updates</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                // License toggle
                const toggleBtns = modalBody.querySelectorAll('#licenseToggle button');
                const priceDisplay = modalBody.querySelector('#priceDisplay');
                const buyBtn = modalBody.querySelector('button:last-of-type');

                toggleBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        toggleBtns.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        const license = btn.dataset.license;
                        currentLicense = license;
                        const price = tpl.free ? 'Free' : `₹${tpl.license[license]}`;
                        priceDisplay.textContent = price;
                        buyBtn.textContent = tpl.free ? 'Download Free' : `Buy Now — ₹${tpl.license[license]}`;
                    });
                });

                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeModal() {
                modal.classList.remove('active');
                document.body.style.overflow = '';
            }

            modalClose.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

            // Initial render
            renderTemplates('all');
        })();
    </script>
</body>
</html>
